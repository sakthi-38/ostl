name: Java Maven CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the source code from the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cache Maven dependencies (targeting the subfolder pom.xml)
      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('calculator-junit/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Compile, run tests, and verify the project inside calculator-junit
      - name: Build and Test with Maven
        working-directory: ./calculator-junit
        run: mvn --batch-mode --update-snapshots clean verify
